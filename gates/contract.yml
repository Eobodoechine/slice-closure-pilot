# Slice Closure Gate contract. Read ONLY from the base branch by CI.
# Rule: a PR that edits gates/** or .github/workflows/** fails the gate.
#
# REPOINTED to SLICE-PILOT-002. SLICE-PILOT-001 (validate_pilot_input) is merged,
# so under a closure gate its contract is satisfied-and-done: every honest PR
# would now block with definition-preexisting, which is correct but leaves the
# repo permanently red. Repointed at an UNLANDED symbol rather than parking the
# contract, because parking would drop expect_definition entirely and the whole
# point of the next step is to observe the definition check in REAL CI -- a
# parked contract can only exercise test_cmd.
slice_id: "SLICE-PILOT-002"

# expect_definition is AST-checked: the name must be a real def/async def/class
# binding in the committed tree. Use this for "the slice landed the symbol".
#
# It replaces `expect_substring: "def validate_pilot_input"`, which was a raw text
# match and therefore satisfied by a mention in a comment or docstring. That is not
# theoretical here: branch pilot/t3-hollow was written to be BLOCKED and passed,
# because its own docstring said the file "deliberately does NOT contain
# `def validate_pilot_input`". Note expect_file would NOT have prevented that --
# it narrows which text is searched, then still does a raw match.
expect_definition: ""

# expect_file: ""            # optional: restrict the HEAD search to one path. The base
#                            # lookup stays repo-wide on purpose, so a symbol that merely
#                            # moved into that path is not counted as landed.
# expect_substring: ""       # raw text match -- only for assertions genuinely about
#                            # text (a version string, a config value), never for
#                            # "this symbol exists". See reality_gate.py's docstring.
#
# expect_definition requires the change to INTRODUCE the name at MODULE level, judged
# against the MERGE BASE. Not satisfied by: a method on a class, a def nested in another
# function, a def under `if False:` or `if TYPE_CHECKING:`, a def later `del`-eted, a
# definition only under tests/ docs/ examples/, a pure rename, or a symbol that already
# existed at the merge base (-> definition-preexisting).

expect_substring: ""
test_cmd: ""
test_timeout: 600
