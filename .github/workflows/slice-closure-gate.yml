name: slice-closure-gate
on:
  pull_request_target:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  slice-closure-gate:
    name: slice-closure-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head (full history for base access)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # This job runs PR-head-controlled code (pytest, and the contract's
          # test_cmd) in this workspace, under pull_request_target, on a PUBLIC
          # repo. persist-credentials defaults to TRUE, which writes the
          # GITHUB_TOKEN into .git/config right where that code can read it.
          # The token is contents:read and the repo has no secrets, so the blast
          # radius is small -- but there is no reason to hand it over at all.
          # Note for the N-repo template: on a PRIVATE repo the anonymous
          # `git fetch` below would then fail, and the gate blocks (fail-closed,
          # but you would need to pass the token to that one step explicitly).
          persist-credentials: false

      - name: Load contract and gate FROM BASE BRANCH ONLY (fail-closed if absent)
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          # NOT --depth=1: that turns the fetch-depth:0 checkout into a shallow
          # repo, after which `git merge-base` has no ancestry to work with and
          # the gate blocks EVERY pr with definition-shallow-repo.
          git fetch --no-tags origin "$BASE" || true
          git rev-parse --is-shallow-repository
          mkdir -p /tmp/basegate
          git show "$BASE:gates/contract.yml"    > /tmp/basegate/contract.yml
          git show "$BASE:gates/reality_gate.py" > /tmp/basegate/reality_gate.py

      - name: Classify PR lane from git data (unforgeable)
        id: lane
        run: |
          # Deliberately NOT `set -e`. classify exits 1 for the ceremony lanes,
          # so under errexit this step died before `mode=` was ever written --
          # steps.lane.outputs.mode stayed empty, the annotated refusal step
          # below could never match, and every ceremony PR surfaced as an opaque
          # step failure with no explanation. Capture the verdict, then refuse.
          set -uo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          python3 /tmp/basegate/reality_gate.py classify \
            --repo "$GITHUB_WORKSPACE" --commit "$HEAD" --base-ref "$BASE" \
            > /tmp/lane.json
          RC=$?
          cat /tmp/lane.json || true
          MODE="$(python3 -c "import json; print(json.load(open('/tmp/lane.json'))['mode'])" 2>/dev/null)" || MODE=""
          # Fail closed: no readable verdict is a refusal, never a pass.
          [ -n "$MODE" ] || MODE="unreadable"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

      - name: Refuse ceremony, mixed and unreadable lanes
        if: steps.lane.outputs.rc != '0' || (steps.lane.outputs.mode != 'slice' && steps.lane.outputs.mode != 'gate-maintenance')
        run: |
          set -euo pipefail
          echo "::error::PR lane '${{ steps.lane.outputs.mode }}' (classify rc=${{ steps.lane.outputs.rc }}) is not judged by the gate. Workflow changes and gate-code-mixed-with-code PRs are merged only by the bypass actor; an unreadable lane is always a refusal."
          exit 1

      - name: Refuse contracts without binding assertions (closes the cmd_check gap)
        if: steps.lane.outputs.mode == 'slice'
        id: contract
        run: |
          set -euo pipefail
          pip install --quiet pyyaml pytest
          python3 - <<'EOF'
          import yaml, sys, os, uuid
          c = yaml.safe_load(open('/tmp/basegate/contract.yml'))
          if not isinstance(c, dict):
              print("::error::contract.yml is not a mapping — refusing")
              sys.exit(1)

          def scalar(key):
              """A binding value must be a STRING. Any other type is refused rather
              than coerced: `(v or '').strip()` silently turned 0 into '' (an
              assertion that looks pinned and enforces nothing) and blew up with
              AttributeError on anything truthy and non-str. gates/reality_gate.py's
              _assertion_classes pins the same rule, and the suite asserts the two
              agree."""
              v = c.get(key)
              if v is None:
                  return ''
              if not isinstance(v, str):
                  print(f"::error::{key} must be a string, got {type(v).__name__} — refusing")
                  sys.exit(1)
              return v.strip()

          sub = scalar('expect_substring')
          dfn = scalar('expect_definition')
          cmd = scalar('test_cmd')
          fil = scalar('expect_file')
          if not sub and not dfn and not cmd:
              print("::error::contract.yml pins none of expect_definition / expect_substring / test_cmd — refusing (no-binding-contract)")
              sys.exit(1)
          if dfn and not dfn.isidentifier():
              print("::error::expect_definition must be a bare identifier (e.g. 'foo', not 'def foo') — refusing")
              sys.exit(1)

          # A newline in a contract value would forge extra step outputs through
          # the `key=value` writer below. Refuse; the delimiter form is used anyway.
          for name, value in (('expect_substring', sub), ('expect_definition', dfn),
                              ('test_cmd', cmd), ('expect_file', fil)):
              if '\n' in value or '\r' in value or '\0' in value:
                  print(f"::error::{name} contains a newline or NUL — refusing")
                  sys.exit(1)

          # Heredoc form with a random delimiter: the `key=value` form cannot
          # represent a value containing a newline and is forgeable.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for name, value in (('sub', sub), ('dfn', dfn), ('cmd', cmd), ('file', fil)):
                  d = 'ghadelim_' + uuid.uuid4().hex
                  f.write(f"{name}<<{d}\n{value}\n{d}\n")
              f.write(f"timeout={int(c.get('test_timeout') or 600)}\n")
          EOF

      - name: Maintain-mode gate check (base gate authorizes head gate)
        if: steps.lane.outputs.mode == 'gate-maintenance'
        id: maintain
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # maintain reads the contract with the SAME parser that builds the
          # gate's assertions further down. It refuses (maintenance-no-yaml)
          # rather than degrading to a weaker reading, so pyyaml is required
          # here, not optional -- a line scan disagreed with yaml on
          # `expect_definition: ""` and let the exam-tamper through.
          pip install --quiet pyyaml
          python3 /tmp/basegate/reality_gate.py maintain \
            --repo "$GITHUB_WORKSPACE" --commit "$HEAD" --base-ref "$BASE" \
            | tee /tmp/maintain.json
          # exit code of reality_gate propagates via pipefail

      - name: Run the base's negative matrix against the head gate (head implementation, base assertions)
        if: steps.lane.outputs.mode == 'gate-maintenance'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          pip install --quiet pyyaml pytest
          # Stage base's test_gate_hollow_slice.py next to the head's gates/ so
          # _locate_gate resolves the same layout as in the repo.
          mkdir -p /tmp/oldmatrix/{tests,gates}
          git show "$BASE:tests/test_gate_hollow_slice.py" > /tmp/oldmatrix/tests/test_gate_hollow_slice.py
          if git cat-file -e "$BASE:tests/conftest.py" 2>/dev/null; then
            git show "$BASE:tests/conftest.py" > /tmp/oldmatrix/tests/conftest.py
          fi
          cp gates/reality_gate.py /tmp/oldmatrix/gates/reality_gate.py
          python3 -m pytest -q /tmp/oldmatrix/tests/test_gate_hollow_slice.py

      - name: Run reality_gate check at PR head with base-pinned assertions
        if: steps.lane.outputs.mode == 'slice'
        # Contract values reach this step ONLY through env, never through
        # ${{ }} interpolation. ${{ }} is substituted into the script's SOURCE
        # TEXT before bash parses it, so a contract carrying
        #     expect_substring: 'x" ] && exit 0 # '
        # rendered as  [ -n "x" ] && exit 0 # " ] && ARGS+=(...)  and the step
        # exited 0 with reality_gate.py never invoked -- a green required check
        # and no gate run at all. Reached through the gate-maintenance lane,
        # because ADDING an assertion class reads as strengthening: classify,
        # maintain, the base negative matrix and the head suite all pass it.
        # tests/test_gate_maintenance.py has a static test that no
        # ${{ steps.contract.outputs.* }} ever appears in a run: body again.
        env:
          SUB: ${{ steps.contract.outputs.sub }}
          DFN: ${{ steps.contract.outputs.dfn }}
          FILE: ${{ steps.contract.outputs.file }}
          CMD: ${{ steps.contract.outputs.cmd }}
          TIMEOUT: ${{ steps.contract.outputs.timeout }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # --base-ref makes the definition check evaluate base..head, i.e. what
          # the PR actually proposes. Without it the gate judges the tip commit
          # alone, so a multi-commit PR that lands the symbol early and tips with
          # a docs tweak would be wrongly blocked.
          ARGS=(check --repo "$GITHUB_WORKSPACE" --commit "$HEAD_SHA" --base-ref "$BASE_SHA")
          [ -n "$SUB" ]  && ARGS+=(--expect-substring "$SUB")
          [ -n "$DFN" ]  && ARGS+=(--expect-definition "$DFN")
          [ -n "$FILE" ] && ARGS+=(--expect-file "$FILE")
          [ -n "$CMD" ]  && ARGS+=(--test-cmd "$CMD")
          ARGS+=(--test-timeout "$TIMEOUT")
          python3 /tmp/basegate/reality_gate.py "${ARGS[@]}" | tee /tmp/verdict.json
          # exit code of reality_gate propagates via pipefail

      - name: Run the head's own test suite (maintenance mode)
        if: steps.lane.outputs.mode == 'gate-maintenance'
        run: |
          pip install --quiet pyyaml pytest
          python3 -m pytest -q

      - name: Upload verdict receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice-closure-receipt-${{ github.event.pull_request.number }}
          path: |
            /tmp/lane.json
            /tmp/verdict.json
            /tmp/maintain.json
          if-no-files-found: ignore